<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="whiteShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f7fcff"/>
      <stop offset="1" stop-color="#d9f3ff"/>
    </linearGradient>
    <linearGradient id="bluePart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45cfff"/>
      <stop offset="0.52" stop-color="#238ddb"/>
      <stop offset="1" stop-color="#1269ba"/>
    </linearGradient>
    <linearGradient id="darkVisor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#163d78"/>
      <stop offset="0.55" stop-color="#102b5c"/>
      <stop offset="1" stop-color="#081d45"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="45%" r="60%">
