; VariOne S3 hardware profile on stock Bruce (no VariOne overlay).
; Drives ST7735S 128x160 TFT via Bruce's LovyanGFX HAL + the device button/pin map.

[env:varione-s3]
board = varione-s3
board_build.arduino.memory_type = qio_qspi
board_build.partitions = custom_8Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/varione-s3>
build_flags =
	${env.build_flags}
	-Iboards/varione-s3
	-DDEVICE_NAME='"VariOne S3 DevKitC-1 N8R2"'
	-DVARIONE_VERSION='"1.0"'
	-DVARIONE_HIDE_UNSUPPORTED_MENUS=1
	-DVARIONE_VEMO_UI=1
	-DDISABLE_IBUTTON_MENU=1
	; Batch 2 declutter: hide submenu entries (code stays compiled-out, in-tree)
	-DVARIONE_HIDE_AUDIO_CONFIG=1
	-DVARIONE_HIDE_NINEBOT=1
	; Long-press nav on OK/BACK so the device is fully drivable from those two
	; buttons while the D-pad is flaky. Set NAV=0 to revert to plain short-press.
	-DVARIONE_LONGPRESS_NAV=1
	-DVARIONE_LONGPRESS_MS=400
	; Without BOARD_HAS_PSRAM the InputHandler task defaults to a 2048-byte stack
	; (precompiler_flags.h), which overflows under heavy deauth -> stack-canary
	; panic. Give it real headroom.
	-DINPUT_HANDLER_TASK_STACK_SIZE=8192
	-DUSB_as_HID=1
	-DHAS_BTN=1
	-DL_BTN=39
	-DUP_BTN=40
	-DR_BTN=2
	-DDW_BTN=42
	-DSEL_BTN=45
	-DOK_BTN=45
	-DBACK_BTN=46
	-DBTN_ALIAS='"OK"'
	-DBTN_ACT=LOW
	-DGROVE_SDA=8
	-DGROVE_SCL=9
	-DSDCARD_CS=16
	-DSDCARD_SCK=6
	-DSDCARD_MISO=5
	-DSDCARD_MOSI=7
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=4
	-DCC1101_SS_PIN=10
	-DCC1101_MOSI_PIN=11
	-DCC1101_SCK_PIN=12
	-DCC1101_MISO_PIN=13
	-DUSE_HSPI_PORT
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=17
	-DNRF24_SS_PIN=15
	-DNRF24_MOSI_PIN=11
	-DNRF24_SCK_PIN=12
	-DNRF24_MISO_PIN=13
	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=10
	-DIR_TX_PINS='{{"VariOne IR TX", 18}}'
	-DIR_RX_PINS='{{"VariOne IR RX", 14}}'
	-DRF_TX_PINS='{{"VariOne IR TX", 18}}'
	-DRF_RX_PINS='{{"VariOne IR RX", 14}}'
	-DTXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DMINBRIGHT=160
	-DFP=1
	-DFM=1
	-DFG=2
	-DUSE_LOVYANGFX=1
	-DLOVYAN_PANEL=Panel_ST7735S
	"-DLOVYAN_BUS=Bus_SPI"
	-DLOVYAN_SPI_BUS
	-DTFT_SPI_HOST=SPI2_HOST
	-DTFT_SPI_MODE=0
	-DTFT_WRITE_FREQ=27000000
	-DTFT_READ_FREQ=8000000
	-DTFT_SPI_3WIRE=0
	-DTFT_USE_LOCK=1
	-DTFT_SCLK=12
	-DTFT_MOSI=11
	-DTFT_MISO=-1
	-DTFT_DC=36
	-DTFT_CS=38
	-DTFT_RST=35
	-DTFT_BUSY_PIN=-1
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DTFT_OFFSET_X=2
	-DTFT_OFFSET_Y=1
	-DTFT_ROTATION=1
	-DTFT_RGB_ORDER=1
	-DTFT_INVERTION=1
	-DTFT_MEM_WIDTH=132
	-DTFT_MEM_HEIGHT=162

lib_deps =
	${env.lib_deps}
	https://github.com/lovyan03/LovyanGFX#develop
	Preferences
	ESPmDNS
	DNSServer
	ESP32 Async UDP
	TFT_eSPI QRcode
	PN532_SRIX
